<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de DJ</title>

    <!--
      =========================================================
      COLEGA: pode editar o arquivo em
      src/main/resources/static/css/estilo.css
      livremente. Não precisa mexer em nada de Java.
      =========================================================
    -->
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header>
    <h1>🎧 Mesa de DJ</h1>
</header>

<!--
  =========================================================
  COLEGA: os dados abaixo já vêm prontos do backend.
  'estados' é um mapa Nome -> Estado (TOCANDO / PAUSADO).
  Sinta-se livre para reorganizar o HTML (cards, grid,
  ícones, animações etc), só mantenha os atributos th:*
  ou peça ajuda para adaptá-los.
  =========================================================
-->
<main>
    <section id="instrumentos">
        <div class="instrumento-card" th:each="entrada : ${estados}"
             th:classappend="${entrada.value.name() == 'TOCANDO'} ? 'tocando' : 'pausado'">
            <h2 th:text="${entrada.key}">Nome</h2>
            <p class="estado" th:text="${entrada.value}">ESTADO</p>
        </div>
    </section>

    <section id="comandos">
        <form th:action="@{/comando}" method="post">
            <input type="text" name="comando" placeholder="ex: bateria pausar" autocomplete="off" autofocus/>
            <button type="submit">Enviar</button>
        </form>
        <p class="ajuda">
            Comandos: <code>&lt;bateria|baixo|synth|todas&gt; &lt;pausar|retomar&gt;</code>
        </p>
    </section>

    <section id="log">
        <h3>Log da mesa</h3>
        <ul id="log-lista">
            <li th:each="linha : ${log}" th:text="${linha}">linha de log</li>
        </ul>
    </section>
</main>

<script>
    // Atualiza os dados a cada 1s sem precisar recarregar a página.
    // COLEGA: se quiser uma experiência mais fluida (sem F5 no form),
    // pode usar essa função para reescrever o HTML dos instrumentos
    // e do log direto no DOM, em vez de confiar só no redirect do form.
    async function atualizarStatus() {
        try {
            const resp = await fetch('/api/status');
            const dados = await resp.json();
            // dados.estados -> { "Bateria": "TOCANDO", ... }
            // dados.log -> ["[10:22:01] Bateria pausado.", ...]
            console.log(dados);
        } catch (e) {
            console.error('Erro ao atualizar status', e);
        }
    }
    setInterval(atualizarStatus, 1000);
</script>

</body>
</html>
